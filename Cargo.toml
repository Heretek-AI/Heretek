[workspace]
resolver = "2"
members = [
    "crates/heretek-core",
    "crates/heretek-gate",
    "crates/heretek-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Heretek-AI/Heretek"
authors = ["Heretek AI contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
heretek-core = { path = "crates/heretek-core" }
heretek-gate = { path = "crates/heretek-gate" }
