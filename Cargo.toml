[workspace]
resolver = "2"
members = [
    "crates/heretek-core",
    "crates/heretek-gate",
    "crates/heretek-cli",
    "crates/heretek-model",
    "crates/heretek-mcp",
    "crates/heretek-agent",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Heretek-AI/Heretek"
authors = ["Heretek AI contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
wait-timeout = "0.2"
heretek-core = { path = "crates/heretek-core" }
heretek-gate = { path = "crates/heretek-gate" }
heretek-model = { path = "crates/heretek-model" }
heretek-mcp = { path = "crates/heretek-mcp" }
heretek-agent = { path = "crates/heretek-agent" }
